<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <title>Blog Overview</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
  <script src="js/blog.js" defer></script>


</head>
<body>
  <div id="header"></div>

  <main>
    <section class="blog-overview">
        <section class="blog-overview-top">
      <h1>Blog posts</h1>
      <div class="filters">
        <button data-category="11">Presentations</button>
        <button data-category="13">Equipment</button>
        <button data-category="14">Nice to know</button>
        <button data-category="15">All</button>
      </div>
    </section>
      <div id="blog-container" class="blog-grid"></div>
      <button id="load-more" class="load-more">Load more</button>
    </section>
  </main>


  <div id="footer"></div>


</body>
</html>
